name: Generate and Sync JSON to R2

on:
  push:
    branches:
      - main
    paths:
      - "db/**"
      - "generate.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/generate-and-sync-r2.yml"
  workflow_dispatch:

concurrency:
  group: generate-and-sync-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate static JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm check

      - name: Generate JSON files
        run: pnpm generate

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: wilayah-json
          path: dist/
          if-no-files-found: error
          retention-days: 1

  sync-r2:
    name: Sync JSON to Cloudflare R2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: generate
    permissions: {}

    steps:
      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: wilayah-json
          path: dist/

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = public-read
          EOF

      - name: Sync JSON files to R2
        run: |
          rclone sync ./dist r2:${{ secrets.R2_BUCKET_NAME }}/wilayah \
            --checksum \
            --transfers=20 \
            --no-update-modtime \
            --verbose
